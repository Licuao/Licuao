name: Imprimir etiqueta

on:
  schedule:
    - cron: "17 10 * * *"   # todos los días, 07:17 en Chile
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/etiqueta.py, .github/workflows/etiqueta.yml]

permissions:
  contents: write

jobs:
  imprimir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar etiqueta.svg
        run: python scripts/etiqueta.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Guardar si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etiqueta.svg
          git diff --staged --quiet || (git commit -m "Imprimir etiqueta" && git push)
